name: write-inputs-to-job-summary
author: sshah
description: Writes a markdown table of inputs to the GitHub step summary

inputs:
  inputs-json:
    description: 'JSON object of parameter names and values, e.g. the output of toJSON()'
    required: true

runs:
  using: composite
  steps:
    - name: Write inputs table to job summary
      shell: bash
      env:
        INPUTS_JSON: ${{ inputs.inputs-json }}
      run: |
        {
          echo "### Inputs JSON"
          echo ""
          echo "| Parameter | Value |"
          echo "| :--- | :--- |"
          echo "$INPUTS_JSON" | jq -r 'to_entries[] | "| **\(.key)** | \(.value // "Not provided") |"'
        } >> "$GITHUB_STEP_SUMMARY"